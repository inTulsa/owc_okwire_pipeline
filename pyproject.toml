[project]
name = "owcdata"
version = "0.1.0"
description = "OWC data platform — Lightcast and Oklahoma enrollment pipelines"
readme = "README.md"
requires-python = ">=3.12"

# One image, both pipelines. Versions are pinned with upper bounds so a
# rebuild months from now produces the same container.
dependencies = [
    # shared
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "structlog>=24.4,<26.0",
    "PyYAML>=6.0,<7.0",
    "typer>=0.15,<0.20",
    "python-dotenv>=1.0,<2.0",
    "pyarrow>=18.0,<22.0",
    # lightcast
    "snowflake-connector-python>=3.12,<5.0",
    # enrollment — xlrd is required for the pre-2019 legacy .xls workbooks
    # still linked on oklahoma.gov; openpyxl reads everything from 2019 on.
    # Losing xlrd in a rebuild silently drops the oldest fiscal years.
    "requests>=2.32,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "xlrd>=2.0,<3.0",
    # sinks
    "google-cloud-storage>=2.18,<4.0",
    "google-cloud-bigquery>=3.27,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.8,<0.15",
    "mypy>=1.13,<2.0",
    "types-requests>=2.32,<3.0",
    "types-PyYAML>=6.0,<7.0",
    "pandas-stubs>=2.2,<3.0",
]

[project.scripts]
owcdata = "owcdata.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owcdata"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The pristine copy of the original enrollment script is a byte-identical
# reference, not source. `make diff-enrollment` compares against it, so a
# linter must never touch it.
extend-exclude = [
    "tests/fixtures/primary_enrollment_data_script.original.py",
    # Generated by scripts/derive_scrape.py from the pristine original.
    # Formatting it rewraps lines in the ORIGINAL parsing code, which makes
    # `make diff-enrollment` unreadable and defeats the whole point of being
    # able to prove the logic was not touched.
    "src/owcdata/pipelines/enrollment/scrape.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is ruff-format's job
    "B008",    # typer uses function calls in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
# scrape.py is the enrollment script carried over with its logic unchanged.
# Restyling it would defeat the point of being able to diff it against the
# original, so it is exempt from the lint rules that would rewrite it.
"src/owcdata/pipelines/enrollment/scrape.py" = ["E", "W", "B", "SIM", "C4", "RUF", "UP", "N"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
exclude = ["tests/fixtures/primary_enrollment_data_script\\.original\\.py"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Carried-over script: untyped by origin, and typing it would mean editing it.
module = "owcdata.pipelines.enrollment.scrape"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["snowflake.*", "bs4.*", "google.*", "structlog.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: touches the network (Snowflake, oklahoma.gov, GCS, BigQuery)",
]
addopts = "-m 'not integration'"
