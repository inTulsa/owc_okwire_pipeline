# Cloud Build, because docker is not installed on the maintainers' laptops.
#   make build ENV=dev
#
# Two rules Cloud Build enforces that are easy to trip over:
#
#   1. Every substitution passed with --substitutions must be REFERENCED
#      somewhere below. A key that is merely declared here and never used
#      fails the build with "key ... in the substitution data is not matched
#      in the template". So there is no _ENV: the image is deliberately
#      environment-agnostic (one image for both pipelines and both
#      environments — see ADR-007), and the environment arrives as a runtime
#      env var on the Cloud Run job, not as a build arg.
#
#   2. Built-in substitutions such as SHORT_SHA and COMMIT_SHA are only
#      populated for builds started by a trigger, not by `gcloud builds
#      submit`. User-defined keys must start with an underscore, so the tag
#      is _TAG rather than SHORT_SHA.
#
# Terraform references the image by DIGEST, not by tag, so a rollback is a
# revert rather than a race against a moving tag. `make build` prints the
# digest; it is not written to a GCS artifact, which would need a bucket
# nothing here creates.

substitutions:
  _REGION: us-central1
  # Artifact Registry repo, per the OMES naming convention
  # (ar-<name_prefix>-images-1). Supplied by `make build` and the deploy
  # workflow; this default only keeps a bare `gcloud builds submit` parseable.
  _REPOSITORY: images
  _IMAGE: owcdata
  _TAG: latest
  # Full email of the build identity. Supplied by `make build` and by the
  # deploy workflow; see the serviceAccount field below.
  _BUILD_SA: ""

# Run as our own build identity rather than the Compute Engine default SA,
# which carries project Editor. Specifying this REQUIRES
# options.logging: CLOUD_LOGGING_ONLY (set below) — a build with its own
# service account cannot use the default logging behavior.
serviceAccount: "projects/${PROJECT_ID}/serviceAccounts/${_BUILD_SA}"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# Cloud Build pushes these after the steps succeed, and prints each digest.
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest"

steps:
  # Warm the layer cache. `|| exit 0` because on the very first build there is
  # no :latest to pull, and a missing --cache-from image should not be fatal.
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker pull "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest" || exit 0

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=docker/Dockerfile
      - --build-arg=GIT_SHA=${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest
      - .
