name: Deploy

# ---------------------------------------------------------------------------
# Branch IS the environment. `dev` deploys to the dev project, `prod` deploys
# to the prod project, and neither project can reach the other.
#
# The earlier design built once on main and promoted that exact digest into
# prod. It guaranteed prod ran the bytes dev tested, but it only worked by
# having prod pull from DEV's Artifact Registry — a cross-project dependency
# that put production's runtime image inside the environment people feel free
# to break. Promotion is a pull request from dev to prod instead: the diff is
# reviewable, and the two projects stay genuinely independent.
#
# The cost of rebuilding rather than promoting is that "same commit" only
# means "same image" if the build is reproducible, so docker/Dockerfile pins
# the base image by digest and installs from a fully pinned requirements.txt.
# Those two pins are what make this model safe; do not loosen them.
# ---------------------------------------------------------------------------
on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Per environment, so a dev deploy never queues behind a prod one.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: build + deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # One job serves both environments by looking its settings up in the
      # `vars` context by name, rather than duplicating the whole job behind
      # two `if:` conditions that would then drift apart.
      - name: resolve environment
        id: env
        run: |
          set -euo pipefail
          ENV="${{ github.ref_name }}"
          case "$ENV" in
            dev|prod) ;;
            *) echo "::error::Deploy only runs on dev or prod, not '$ENV'."; exit 1 ;;
          esac
          UP=$(echo "$ENV" | tr a-z A-Z)
          echo "env=$ENV"   >> "$GITHUB_OUTPUT"
          echo "upper=$UP"  >> "$GITHUB_OUTPUT"

      # Fail with a sentence rather than an opaque auth error further down.
      - name: check ${{ steps.env.outputs.env }} is configured
        env:
          WIF: ${{ vars[format('WIF_PROVIDER_{0}', steps.env.outputs.upper)] }}
          SA: ${{ vars[format('DEPLOYER_SA_{0}', steps.env.outputs.upper)] }}
          PROJECT: ${{ vars[format('PROJECT_ID_{0}', steps.env.outputs.upper)] }}
          PREFIX: ${{ vars[format('NAME_PREFIX_{0}', steps.env.outputs.upper)] }}
        run: |
          UP="${{ steps.env.outputs.upper }}"
          missing=""
          [ -n "$WIF" ]     || missing="$missing WIF_PROVIDER_$UP"
          [ -n "$SA" ]      || missing="$missing DEPLOYER_SA_$UP"
          [ -n "$PROJECT" ] || missing="$missing PROJECT_ID_$UP"
          [ -n "$PREFIX" ]  || missing="$missing NAME_PREFIX_$UP"
          if [ -n "$missing" ]; then
            echo "::error::${{ steps.env.outputs.env }} is not set up yet. Missing repository variables:$missing"
            echo "Bootstrap the project, then: make gh-vars ENV=${{ steps.env.outputs.env }}"
            echo "See docs/04-deployment.md#setting-up-github-actions"
            exit 1
          fi

          # Non-empty is not the same as valid. `gh variable set --body
          # "$(terraform output ...)"` happily stores the TEXT of a terraform
          # warning when the command fails, and that passes every check
          # above. It was found in this repo: WIF_PROVIDER_PROD held
          # "Warning: No outputs found", ANSI escapes and all. Shape-checking
          # here turns an unreadable failure at the auth step into a sentence.
          bad=""
          case "$WIF" in
            projects/*/locations/global/workloadIdentityPools/*/providers/*) ;;
            *) bad="$bad WIF_PROVIDER_$UP" ;;
          esac
          case "$SA" in
            *@*.iam.gserviceaccount.com) ;;
            *) bad="$bad DEPLOYER_SA_$UP" ;;
          esac
          case "$PROJECT" in
            *[!a-z0-9-]*|"") bad="$bad PROJECT_ID_$UP" ;;
          esac
          case "$PREFIX" in
            *[!a-z0-9-]*|"") bad="$bad NAME_PREFIX_$UP" ;;
          esac
          if [ -n "$bad" ]; then
            echo "::error::These repository variables are set but malformed:$bad"
            echo "A likely cause is 'gh variable set --body \"\$(terraform output ...)\"' capturing"
            echo "an error message instead of a value. Re-run: make gh-vars ENV=${{ steps.env.outputs.env }}"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars[format('WIF_PROVIDER_{0}', steps.env.outputs.upper)] }}
          service_account: ${{ vars[format('DEPLOYER_SA_{0}', steps.env.outputs.upper)] }}

      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Cloud Build
        id: build
        env:
          PROJECT: ${{ vars[format('PROJECT_ID_{0}', steps.env.outputs.upper)] }}
          PREFIX: ${{ vars[format('NAME_PREFIX_{0}', steps.env.outputs.upper)] }}
          REGION: ${{ vars.REGION }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          # _TAG, not the built-in SHORT_SHA: built-ins are only populated for
          # trigger-started builds. Every substitution passed here must be
          # referenced in cloudbuild.yaml or the build fails.
          gcloud builds submit \
            --config docker/cloudbuild.yaml \
            --substitutions="_TAG=${SHA},_REGION=${REGION},_REPOSITORY=ar-${PREFIX}-images-1,_BUILD_SA=sa-${PREFIX}-build-1@${PROJECT}.iam.gserviceaccount.com" \
            --project "${PROJECT}" \
            .
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/ar-${PREFIX}-images-1/owcdata"
          DIGEST=$(gcloud artifacts docker images describe "${IMAGE}:${SHA}" \
            --format='value(image_summary.digest)' --project "${PROJECT}")
          echo "digest=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Built ${IMAGE}@${DIGEST}"

      - name: apply
        working-directory: infra/terraform/envs/${{ steps.env.outputs.env }}
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="image_digest=${{ steps.build.outputs.digest }}"

      # The image digest is in lifecycle.ignore_changes on the job, so it is
      # set here explicitly rather than by the apply above. That keeps a
      # manual `gcloud run jobs update` during an incident from being
      # reverted by the next unrelated apply.
      - name: point both jobs at the new digest
        env:
          PROJECT: ${{ vars[format('PROJECT_ID_{0}', steps.env.outputs.upper)] }}
          PREFIX: ${{ vars[format('NAME_PREFIX_{0}', steps.env.outputs.upper)] }}
        run: |
          set -euo pipefail
          for job in "cr-${PREFIX}-lightcast-1" "cr-${PREFIX}-enrollment-1"; do
            gcloud run jobs update "$job" \
              --image "${{ steps.build.outputs.digest }}" \
              --region "${{ vars.REGION }}" \
              --project "${PROJECT}"
          done

      # ---------------------------------------------------------------------
      # Smoke, dev only.
      #
      # An apply proves Terraform is happy; only a run proves the image works.
      # But these are not dry runs — enrollment scrapes oklahoma.gov and
      # publishes for real. Doing that on every prod deploy would make
      # deploying and running the pipeline the same act, which is exactly what
      # the schedulers exist to keep separate.
      # ---------------------------------------------------------------------
      - name: smoke — lightcast, one small dataset, row limited
        if: steps.env.outputs.env == 'dev'
        env:
          PROJECT: ${{ vars.PROJECT_ID_DEV }}
          PREFIX: ${{ vars.NAME_PREFIX_DEV }}
        run: |
          set -euo pipefail
          gcloud run jobs execute "cr-${PREFIX}-lightcast-1" \
            --region "${{ vars.REGION }}" --project "${PROJECT}" \
            --tasks 1 --task-timeout 600s --wait \
            --args="run,lightcast,--dataset,dim_area,--limit,1000"

      - name: smoke — enrollment
        if: steps.env.outputs.env == 'dev'
        env:
          PROJECT: ${{ vars.PROJECT_ID_DEV }}
          PREFIX: ${{ vars.NAME_PREFIX_DEV }}
        run: |
          set -euo pipefail
          # Expected to short-circuit on the cache in most months, which is a
          # success. A non-zero exit here means something real broke.
          gcloud run jobs execute "cr-${PREFIX}-enrollment-1" \
            --region "${{ vars.REGION }}" --project "${PROJECT}" \
            --wait

      - name: record what was deployed
        run: |
          {
            echo "### Deployed to ${{ steps.env.outputs.env }}"
            echo ""
            echo "- image: \`${{ steps.build.outputs.digest }}\`"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- branch: \`${{ github.ref_name }}\`"
            echo ""
            echo "To roll back: revert the commit on this branch and push."
          } >> "$GITHUB_STEP_SUMMARY"
